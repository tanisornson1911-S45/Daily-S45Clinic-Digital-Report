name: Send daily Digital Report to LINE OA

# ทุกวัน 18:30 เวลาไทย: ดึงรายชื่อแคมเปญ Facebook ที่ Active อยู่ตอนนี้ (เทียบกับเมื่อวานเพื่อหา Ads ที่
# เปิด/ปิดใหม่ — "Monitor Ads") + ยอดใช้งบ/Inbox รายวันแยกบัญชีสำหรับ CPR Nose Open/Inter โดยเฉพาะ แล้ว
# ประกอบเป็นข้อความ "Digital Report" (ใช้ข้อมูลจาก pipeline ในนี้ล้วนๆ ไม่มี Google Sheet ภายนอกแล้ว —
# ตัดส่วน Persona Check/Manual Input ออกตามคำขอผู้ใช้ 2026-10-09) ส่งเข้า LINE OA ผ่าน Messaging API
#
# ต้องตั้ง repo secret เพิ่มจากที่มีอยู่แล้ว (FB_ACCESS_TOKEN):
#   - LINE_CHANNEL_ACCESS_TOKEN  (Channel access token จาก LINE Developers Console ของ LINE OA บัญชีนี้)
#   - LINE_TEST_USER_ID          (LINE user id ของตัวเอง — ใช้ตอน LINE_SEND_MODE=test เท่านั้น)
#
# LINE_SEND_MODE = "broadcast" — ส่งจริงเข้าผู้ติดตาม LINE OA ทั้งหมดทุกวัน (ยืนยันโดยตรงจากผู้ใช้
# 2026-10-09) ตั้งเป้าไว้ที่ 18:30 น. แต่ GitHub Actions schedule ไม่รับประกันเวลารันเป๊ะ — เจอดีเลย์จริง
# 5-6 ชม. ใน 2 รอบแรก (คืน 9/10 ต.ค. 2026) ซึ่งเป็นข้อจำกัดของ GitHub เอง ไม่ใช่ cron ผิด — ผู้ใช้ขอให้ตั้ง
# เวลายิงเร็วขึ้นเผื่อดีเลย์ (2026-10-10) จึงเลื่อนมาเป็น 16:50 น. (เลี่ยงตั้งตรงชั่วโมงเป๊ะเพื่อไม่ให้ไปรอคิว
# พร้อมกับ workflow อื่นๆ ทั่ว GitHub ที่มักตั้งเวลาเป็นเลขกลมๆ)

on:
  schedule:
    # 16:50 เวลาไทย (ICT = UTC+7) = 09:50 UTC
    - cron: "50 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Facebook active-campaign snapshot (for Monitor Ads diff)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-campaign-snapshot.mjs

      - name: Fetch per-account daily spend/Inbox (for CPR Nose Open/Inter)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-cpr-breakdown.mjs

      - name: Commit data snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/campaignSnapshot.json src/data/cprAccountDaily.json
          if git diff --cached --quiet -- src/data/campaignSnapshot.json src/data/cprAccountDaily.json; then
            echo "No change — nothing to commit."
          else
            git commit -m "chore: update Facebook campaign snapshot + per-account CPR data (automated)"
            git push origin HEAD:main
          fi

      - name: Build + send Digital Report to LINE OA
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
          LINE_SEND_MODE: broadcast
        run: node scripts/send-line-report.mjs
