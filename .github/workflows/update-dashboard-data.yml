name: Update dashboard ad-spend data

# ดึงยอด ad spend จริงจาก Facebook Marketing API แล้ว commit ทับ src/data/adSpend.json
# (ยอดรวมรายเดือนต่อหมวด) และ src/data/adDaily.json (ยอดยิง Ads + Inbox/Messenger conversation
# started รายวันต่อหมวด — ใช้แทนไฟล์ Excel "ยอดขาย Online S45 Clinic" ที่กรอกมือช้ากว่าจริง 1-3 วัน
# ในหน้า Ads/โฆษณา และ Inbox & Bad Lead) อัตโนมัติ ถ้าข้อมูลเปลี่ยน — Vercel จะ redeploy เอง
# เมื่อมี commit ใหม่บน branch main
#
# ต้องตั้ง repo secret ชื่อ FB_ACCESS_TOKEN (System User token) ที่ Settings → Secrets and
# variables → Actions → New repository secret — ต้องมีสิทธิ์ ads_read (ใช้กับ Marketing API
# สำหรับยอด ad spend) บวก pages_read_engagement + pages_show_list + pages_read_user_content
# (ใช้กับ Graph API ส่วน Page posts สำหรับการ์ด "เคสเด่นคุณหมอ" — ดู fetch-fb-doctor-posts.mjs)

on:
  schedule:
    # 01:00 เวลาไทย (ICT = UTC+7) = 18:00 UTC ของวันก่อนหน้า
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest ad spend (monthly totals)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-spend.mjs

      - name: Fetch latest ad spend + Inbox (daily)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-daily.mjs

      - name: Fetch top-engagement doctor + procedure posts
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-doctor-posts.mjs

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/adSpend.json src/data/adDaily.json src/data/doctorHeroPosts.json src/data/antArmyPosts.json
          if git diff --cached --quiet -- src/data/adSpend.json src/data/adDaily.json src/data/doctorHeroPosts.json src/data/antArmyPosts.json; then
            echo "No change — nothing to commit."
          else
            git commit -m "chore: update ad-spend + daily Ads/Inbox + doctor/procedure posts data (automated)"
            git push origin HEAD:main
          fi
