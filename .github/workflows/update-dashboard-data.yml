name: Update dashboard ad-spend data

# ดึงยอด ad spend จริงจาก Facebook Marketing API แล้ว commit ทับ src/data/adSpend.json
# (ยอดรวมรายเดือนต่อหมวด) และ src/data/adDaily.json (ยอดยิง Ads + Inbox/Messenger conversation
# started รายวันต่อหมวด — ใช้แทนไฟล์ Excel "ยอดขาย Online S45 Clinic" ที่กรอกมือช้ากว่าจริง 1-3 วัน
# ในหน้า Ads/โฆษณา และ Inbox & Bad Lead) อัตโนมัติ ถ้าข้อมูลเปลี่ยน — Vercel จะ redeploy เอง
# เมื่อมี commit ใหม่บน branch main
#
# ต้องตั้ง repo secret ชื่อ FB_ACCESS_TOKEN (System User token) ที่ Settings → Secrets and
# variables → Actions → New repository secret — ต้องมีสิทธิ์ ads_read (ใช้กับ Marketing API
# สำหรับยอด ad spend) บวก pages_read_engagement + pages_show_list + pages_read_user_content
# (ใช้กับ Graph API ส่วน Page posts สำหรับการ์ด "เคสเด่นคุณหมอ" — ดู fetch-fb-doctor-posts.mjs)

on:
  schedule:
    # 01:00 เวลาไทย (ICT = UTC+7) = 18:00 UTC ของวันก่อนหน้า
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "ทดสอบระบบแจ้งเตือน LINE เท่านั้น — true = จงใจให้ job fail ตั้งแต่ก่อนดึงข้อมูลจริง (ชั่วคราว ลบทิ้งหลังทดสอบผ่าน)"
        type: boolean
        default: false

permissions:
  contents: write
  # actions: read ให้ step "Notify LINE on failure" ท้ายไฟล์เรียก GitHub API ดึง log ของ job ตัวเองมา
  # วิเคราะห์ error ได้ — ดูคอมเมนต์หัวไฟล์ scripts/notify-line-failure.mjs
  actions: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ชั่วคราว — ทดสอบ step "Notify LINE on failure" ท้ายไฟล์ ไม่กระทบข้อมูลจริง (fail ก่อนดึง FB/push KV
      # เลย) ลบ step นี้ + input ด้านบนออกหลังยืนยันว่าได้รับ LINE แจ้งเตือนแล้ว
      - name: Simulate failure (LINE notification test only)
        if: ${{ inputs.simulate_failure == true }}
        run: |
          echo "::error::จงใจ fail เพื่อทดสอบระบบแจ้งเตือน LINE — ไม่ใช่ error จริง"
          exit 1

      - name: Fetch latest ad spend (monthly totals)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-spend.mjs

      - name: Fetch latest ad spend + Inbox (daily)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-daily.mjs

      - name: Fetch top-engagement doctor + procedure posts
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-doctor-posts.mjs

      - name: Fetch real per-doctor Nose Open ad spend + Inbox (latest day)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/fetch-fb-doctor-campaigns.mjs

      # continue-on-error: ป้องกัน Cloudflare KV push ล้มเหลว (เช่น API Token หาย/หมดอายุ — เจอจริง
      # 2026-11-09 ถึง 2026-11-12) แล้วลาก step "Commit & push" ด้านล่างไม่ให้ทำงานไปด้วย ข้อมูลที่ pipeline
      # ดึงมาสำเร็จในรอบนี้ (เช่น ตอน FB token เพิ่งแก้แต่ Cloudflare ยังพังอยู่) จะยังถูก commit เข้า git ได้
      # ปกติ (คือ source of truth หลักที่ dev ใช้อยู่แล้ว) — ส่วน KV เป็นแค่ช่องเสริมสำหรับ production Worker
      # API เท่านั้น ถ้า step นี้ fail จะยังเห็นเป็น warning ใน Actions UI ไม่ได้เงียบหายไปเฉยๆ
      - name: Push data to Cloudflare KV (Worker API reads from here)
        id: push_kv
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: node scripts/push-to-kv.mjs

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/adSpend.json src/data/adDaily.json src/data/doctorHeroPosts.json src/data/antArmyPosts.json src/data/noseOpenDoctorAds.json
          if git diff --cached --quiet -- src/data/adSpend.json src/data/adDaily.json src/data/doctorHeroPosts.json src/data/antArmyPosts.json src/data/noseOpenDoctorAds.json; then
            echo "No change — nothing to commit."
          else
            git commit -m "chore: update ad-spend + daily Ads/Inbox + doctor/procedure posts + Nose Open doctor ads data (automated)"
            git push origin HEAD:main
          fi

      # แจ้งเตือน LINE OA แยกต่างหาก (คนละตัวกับที่ส่งรายงานลูกค้า) ทันทีที่ step ไหนล้มเหลว — ทั้ง hard failure (job แดง) และ
      # soft failure ของ Cloudflare push ที่ตั้ง continue-on-error ไว้ด้านบน (ไม่งั้นจะเงียบไม่มีใครรู้เหมือน
      # 2026-11-09 ถึง 2026-11-12) — ดูคอมเมนต์หัวไฟล์ scripts/notify-line-failure.mjs
      - name: Notify LINE on failure
        if: failure() || steps.push_kv.outcome == 'failure'
        env:
          LINE_ALERT_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_ALERT_CHANNEL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_STEPS: ${{ steps.push_kv.outcome == 'failure' && 'Push data to Cloudflare KV' || '' }}
        run: node scripts/notify-line-failure.mjs
