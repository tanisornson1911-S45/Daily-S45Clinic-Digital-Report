name: Update M365 raw data (staging)

# ดึงข้อมูลดิบจากไฟล์ "Data S45 Clinic (5).xlsx" บน SharePoint/OneDrive
# ผ่าน Microsoft Graph API แล้ว commit ทับ src/data/m365Raw.json อัตโนมัติ
# ถ้าข้อมูลเปลี่ยน — นี่เป็นการดึงข้อมูลดิบมาเตรียมไว้ (staging) เท่านั้น
# ยังไม่ถูกนำไปคำนวณตัวเลขจริงบน Dashboard จนกว่าจะมีการตรวจสอบ mapping
#
# ต้องตั้ง repo secrets ที่ Settings → Secrets and variables → Actions →
# New repository secret:
#   MS_TENANT_ID     — Directory (tenant) ID จาก Azure AD App Registration
#   MS_CLIENT_ID     — Application (client) ID
#   MS_CLIENT_SECRET — Client secret value (ต้อง grant admin consent
#                      สิทธิ์ Files.Read.All (Application) แล้ว)

on:
  schedule:
    # 01:30 เวลาไทย (ICT = UTC+7) = 18:30 UTC ของวันก่อนหน้า
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest M365 data
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: node scripts/fetch-m365-data.mjs

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/m365Raw.json
          if git diff --cached --quiet -- src/data/m365Raw.json; then
            echo "No change in m365Raw.json — nothing to commit."
          else
            git commit -m "chore: update M365 raw data (automated)"
            git push origin HEAD:main
          fi
