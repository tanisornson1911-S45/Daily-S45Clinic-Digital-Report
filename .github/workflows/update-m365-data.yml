name: Update M365 data (RAW_TX pipeline)

# ดึงข้อมูลดิบจากไฟล์ "Data S45 Clinic (5).xlsx" บน SharePoint/OneDrive ผ่าน Microsoft
# Graph API (src/data/m365Raw.json) แล้วแปลงเป็น src/data/rawTx.json ที่ App.jsx import
# ใช้คำนวณ RAW_TX จริง — Dashboard จึงอัปเดตข้อมูลธุรกรรมอัตโนมัติทุกวัน ไม่ต้อง paste มือแล้ว
#
# ต้องตั้ง repo secrets ที่ Settings → Secrets and variables → Actions →
# New repository secret:
#   MS_TENANT_ID     — Directory (tenant) ID จาก Azure AD App Registration
#   MS_CLIENT_ID     — Application (client) ID
#   MS_CLIENT_SECRET — Client secret value (ต้อง grant admin consent
#                      สิทธิ์ Files.Read.All (Application) แล้ว)

on:
  schedule:
    # 01:30 เวลาไทย (ICT = UTC+7) = 18:30 UTC ของวันก่อนหน้า
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest M365 data
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: node scripts/fetch-m365-data.mjs

      - name: Build RAW_TX from M365 data
        run: node scripts/build-raw-tx.mjs

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/m365Raw.json src/data/rawTx.json
          if git diff --cached --quiet -- src/data/m365Raw.json src/data/rawTx.json; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update M365 data + rebuild RAW_TX (automated)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
