name: DEBUG - fb raw actions check (temporary)

# ชั่วคราว — ใช้ตรวจสอบว่าตัวเลข "messaging_conversation_started" จาก Facebook Marketing API
# (raw actions breakdown เดียวกับที่ Ads Manager ใช้แสดงคอลัมน์ "Messaging conversations started")
# ตรงกับยอด Inbox ที่ทีม Digital นับมือในชีตหรือไม่ — ลบ workflow นี้ทิ้งหลังตรวจสอบเสร็จ

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch raw actions breakdown
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node scripts/debug-fb-actions.mjs
