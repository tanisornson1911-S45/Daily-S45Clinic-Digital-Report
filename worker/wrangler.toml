# Cloudflare Worker config for the S45 Dashboard data API.
#
# One-time setup (the person deploying this needs a Cloudflare account —
# Claude cannot do this part, it has no Cloudflare credentials):
#   1. npx wrangler login
#   2. npx wrangler kv namespace create S45_DATA
#      -> copy the returned "id" into the [[kv_namespaces]] block below
#   3. npx wrangler secret put DASH_USER       (same value as Vercel's DASH_USER)
#      npx wrangler secret put DASH_PASS       (same value as Vercel's DASH_PASS)
#   4. Set ALLOWED_ORIGIN below to the exact Dashboard URL (e.g. the Vercel
#      production domain, with no trailing slash) — the Worker only answers
#      browser fetches from this origin.
#   5. npx wrangler deploy
#   6. Copy the deployed Worker URL into the frontend's VITE_WORKER_URL
#      (Vercel Project Settings -> Environment Variables) and redeploy the
#      frontend.
#   7. Add CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_KV_NAMESPACE_ID
#      as GitHub Actions repo secrets so the nightly pipeline can push fresh
#      data into this same KV namespace (see scripts/push-to-kv.mjs).
#
# เพิ่ม 2026-11-14 — Cron Trigger ที่ยิง "Send daily Digital Report to LINE OA" workflow ให้เอง แทนที่จะพึ่ง
# GitHub Actions `schedule:` ของ workflow นั้นเอง (เจอดีเลย์ 5-7+ ชม. ซ้ำๆ 3 วันติด 12-14 พ.ย. 2569 — เป็นปัญหา
# ระดับแพลตฟอร์มของ GitHub Actions scheduled workflow ที่หลีกเลี่ยงไม่ได้ด้วยการเลือกนาทีอื่น) หรือ Routine ของ
# Claude Code (ก็ล้มเหลวเงียบๆ 3 วันติดเช่นกัน เพราะ MCP เชื่อมต่อ GitHub หลุดชั่วคราวตอนปลุก) — Cloudflare Cron
# Trigger แม่นยำกว่ามาก (ปกติคลาดไม่เกินไม่กี่วินาที) และไม่ต้องพึ่ง Claude session เลย ดู scheduled() ใน
# src/index.js — ต้องตั้งเพิ่ม:
#   8. npx wrangler secret put GITHUB_PAT   (GitHub Personal Access Token แบบ fine-grained scope เฉพาะ repo
#      นี้ สิทธิ์ "Actions: Read and write" เท่านั้น — ใช้ยิง workflow_dispatch ผ่าน GitHub REST API)
#      npx wrangler secret put LINE_ALERT_CHANNEL_ACCESS_TOKEN   (ตัวเดียวกับที่ตั้งไว้เป็น GitHub secret
#      LINE_ALERT_CHANNEL_ACCESS_TOKEN อยู่แล้ว — ใช้แจ้งเตือนถ้า Cron Trigger นี้เองยิง GitHub ไม่สำเร็จ)
#   9. ถ้า deploy ผ่าน wrangler (`npx wrangler deploy`) [triggers] ด้านล่างจะตั้ง Cron ให้อัตโนมัติ — แต่ถ้า
#      deploy ผ่าน Cloudflare Dashboard (copy-paste โค้ดใน Edit code แบบที่ทำมาตลอด) ต้องไปตั้ง Cron Trigger
#      เองที่ Workers & Pages -> เลือก Worker -> แท็บ Triggers -> Cron Triggers -> Add Cron Trigger -> ใส่
#      "26 11 * * *" (UTC — Cloudflare Cron Trigger ไม่รองรับ timezone อื่น เวลานี้ตรงกับ 18:26 น. ไทย)

name = "s45-dashboard-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["26 11 * * *"] # 18:26 น. ไทย (ICT = UTC+7) — มีผลเฉพาะตอน deploy ผ่าน wrangler เท่านั้น ดูข้อ 9 ด้านบน

[vars]
ALLOWED_ORIGIN = "https://daily-s45-clinic-digital-report.vercel.app"

[[kv_namespaces]]
binding = "DATA_KV"
id = "10fef57cf49f4c729c64139f9d6ea70e"
# account_id ที่ถูกต้องคือ 681ffefaed6aa884c5199d35d74f4dc5 (เคยอ่านผิดเป็น ...d7af4dc5 จากภาพหน้าจอ — ต่างกันแค่
# "74f" vs "7af" ทำให้ทุก API call ผ่าน Cloudflare REST API ล้มเหลวด้วย "Authentication error" มาตลอดจนกว่าจะเจอ
# ผ่านการเรียก GET /accounts เทียบดู — ตัวแปรนี้ไม่ได้ใช้โดย wrangler.toml เอง (wrangler อ่าน account จาก login
# session) แต่ GitHub secret CLOUDFLARE_ACCOUNT_ID ต้องตั้งเป็นค่านี้ให้ตรง

# DASH_USER / DASH_PASS are set as Worker secrets (wrangler secret put), not
# here — do not put real credentials in this file, it gets committed to git.
